<!DOCTYPE html>
<html>
<head><meta charset="utf-8"></head>
<body>
<script>
  var _sent = false;

  function sendValue(val) {
    window.parent.postMessage({
      type: "streamlit:setComponentValue",
      value: val
    }, "*");
  }

  function onRender(event) {
    if (event.data.type !== "streamlit:render") return;
    if (_sent) return;  // only send once per render

    var args   = event.data.args || {};
    var action = args.action || "get_did";
    var lsKey  = args.lskey  || "filix_device_id";

    if (action === "get_did") {
      // Read or create device ID from localStorage, return it to Python
      var did = null;
      try { did = localStorage.getItem(lsKey); } catch(e) {}
      if (!did) {
        did = 'dev_' + Math.random().toString(36).slice(2,10) +
                       Math.random().toString(36).slice(2,10);
        try { localStorage.setItem(lsKey, did); } catch(e) {}
      }
      _sent = true;
      sendValue(did);
    } else if (action === "noop") {
      _sent = true;
      sendValue("ok");
    }
  }

  window.addEventListener("message", onRender);
  window.parent.postMessage({ type: "streamlit:componentReady", apiVersion: 1 }, "*");
</script>
</body>
</html>
